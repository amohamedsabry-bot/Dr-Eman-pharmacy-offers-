<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول | Dr Eman Pharmacy</title>

<link rel="stylesheet"
href="css/login.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="logo">

<img
src="images/logo.png"
alt="Logo">

<h2>

Dr Eman Pharmacy

</h2>

<p>

لوحة إدارة العروض

</p>

</div>

<form id="loginForm">

<div class="input-group">

<label>

البريد الإلكتروني

</label>

<input

type="email"

id="email"

placeholder="example@email.com"

required>

</div>

<div class="input-group">

<label>

كلمة المرور

</label>

<input

type="password"

id="password"

placeholder="********"

required>

</div>

<div id="errorMessage"

class="error-message">

</div>

<button

type="submit"

class="login-btn">

تسجيل الدخول

</button>

</form>

</div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="js/firebase.js"></script>

<script src="js/login.js"></script>

</body>

</html>
